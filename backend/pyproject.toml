[project]
name = "x-insight"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pgmpy==1.1.2",
    "mcp==2.2.0",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "lxml==6.1.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
