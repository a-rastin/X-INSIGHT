# Production edge config (S57 slice 1): nginx in front of app.
#
# Same origin: the browser calls only relative /api/v1 routes, which land
# here and proxy to app:8000. TLS terminates here; only this edge service
# is externally reachable. No secrets in this file -- the operator mounts
# real certificates at /etc/nginx/certs/ (paths below) outside version
# control. Disposable local installs may use plain HTTP via localhost.
upstream app {
    server app:8000;
}

# Disposable-install path: plain HTTP is allowed on localhost only.
server {
    listen 80;
    server_name localhost 127.0.0.1;

    location /api/v1/ {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

# Outside localhost, port 80 only redirects to HTTPS.
server {
    listen 80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# Public HTTPS entrypoint.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/v1/ {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
