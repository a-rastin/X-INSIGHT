services:
  db:
    image: postgres:14.24
    environment:
      POSTGRES_USER: xinsight
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xinsight_dev}
      POSTGRES_DB: xinsight_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://xinsight:${DB_PASSWORD:-xinsight_dev}@db:5432/xinsight_dev
    ports:
      - "8000:8000"
    depends_on:
      - db
  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
